[package]
name = "ultrafs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bincode = "1.3.3"
blake3 = "1.8.5"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5"
tokio = { version = "1.52.3", features = ["full"] }
colored = "2.1"
rustyline = "18.0.0"
im = { version = "15.1.0", features = ["serde"] }
lz4_flex = "0.11"
lru = "0.12"
thiserror = "1.0"

[build-dependencies]
cc = "1.0"